name: Release Kagero Host

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: host-release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check-version.py --tag "$RELEASE_TAG"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - run: go test -race -timeout 60s ./...
      - run: python3 scripts/test-prepare-brew.py
      - run: python3 scripts/test-sign-release.py
      - run: python3 scripts/test-cloud-profile.py
      - run: swift test --package-path apple
      - name: Prepare signing and notarization credentials
        env:
          HOST_P12_BASE64: ${{ secrets.HOST_P12_BASE64 }}
          HOST_P12_PASSWORD: ${{ secrets.HOST_P12_PASSWORD }}
          HOST_NOTARY_KEY_BASE64: ${{ secrets.HOST_NOTARY_KEY_BASE64 }}
          HOST_NOTARY_KEY_ID: ${{ secrets.HOST_NOTARY_KEY_ID }}
          HOST_NOTARY_ISSUER_ID: ${{ secrets.HOST_NOTARY_ISSUER_ID }}
          HOST_SIGNING_IDENTITY: ${{ secrets.HOST_SIGNING_IDENTITY }}
        run: bash scripts/prepare-signing.sh
      - name: Build and check the native executable
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          HOST_ICLOUD_ENABLED: ${{ vars.HOST_ICLOUD_ENABLED }}
          HOST_CLOUD_PROFILE_BASE64: ${{ secrets.HOST_CLOUD_PROFILE_BASE64 }}
        run: |
          cloud_flags=()
          if [ "$HOST_ICLOUD_ENABLED" = "true" ]; then
            python3 - <<'PYPROFILE'
          import base64, os
          from pathlib import Path
          value = os.environ.get('HOST_CLOUD_PROFILE_BASE64', '')
          if not value: raise SystemExit('Configure HOST_CLOUD_PROFILE_BASE64 before enabling iCloud releases')
          path = Path(os.environ['RUNNER_TEMP']) / 'kagero-cloud.provisionprofile'
          path.write_bytes(base64.b64decode(value, validate=True))
          path.chmod(0o600)
          PYPROFILE
            export HOST_CLOUD_PROFILE="$RUNNER_TEMP/kagero-cloud.provisionprofile"
            cloud_flags+=(--with-icloud)
          fi
          python3 scripts/package.py --signed --arch "$BUILD_ARCH" "${cloud_flags[@]}"
          test "$(./dist/kagero-host-darwin-$BUILD_ARCH version)" = "$(python3 scripts/check-version.py)"
      - name: Remove temporary signing credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/kagero-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/kagero-signing.p12" "$RUNNER_TEMP/kagero-notary.p8" "$RUNNER_TEMP/kagero-cloud.provisionprofile"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/kagero-host-*-darwin-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require Homebrew publishing access
        env:
          DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: test -n "$DEPLOY_KEY" || { echo 'Configure TAP_DEPLOY_KEY before publishing.'; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: dannisun0412/homebrew-tap
          ref: main
          path: tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true
      - name: Publish immutable release and update Homebrew
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/publish-release.sh
